<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>SUPERBRAIN - FingerMath & Soroban</title>

<!-- CSS -->
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/menu.css">
<link rel="stylesheet" href="assets/css/config.css">
<link rel="stylesheet" href="assets/css/game.css">
<link rel="stylesheet" href="assets/css/flashcard.css">
<link rel="stylesheet" href="assets/css/result.css">
</head>
<body>

<!-- ============================================================
     OVERLAY ĐĂNG NHẬP BẰNG SĐT
     ============================================================ -->
<div class="name-overlay" id="nameOverlay">
  <div class="name-modal">
    <h2>Chào mừng đến SUPERBRAIN!</h2>
    <p>Nhập số điện thoại để đăng nhập</p>
    
    <div class="name-field">
      <label for="studentPhoneInput">Số điện thoại</label>
      <input type="tel" id="studentPhoneInput" placeholder="VD: 0901234567" maxlength="15" autocomplete="off">
    </div>
    
    <div class="login-error" id="loginError"></div>
    
    <button class="btn-start-name" id="btnLogin" onclick="doLogin()">ĐĂNG NHẬP</button>
  </div>
</div>

<div class="app">
  <!-- NÚT ÂM THANH -->
  <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="Bật/tắt âm thanh">
    🔊
  </button>
  
  <!-- NÚT THOÁT -->
  <button class="logout-toggle" id="logoutToggle" onclick="confirmLogout()" title="Thoát">
    🚪
  </button>

  <!-- LOGO -->
  <div class="logo">
    <img src="icon/logo.png" alt="SUPERBRAIN" class="logo-img"
         onerror="this.parentElement.innerHTML='🧠 SUPERBRAIN'; this.parentElement.style.fontSize='28px'; this.parentElement.style.fontWeight='800'; this.parentElement.style.background='linear-gradient(135deg,#667eea,#764ba2)'; this.parentElement.style.webkitBackgroundClip='text'; this.parentElement.style.webkitTextFillColor='transparent';">
  </div>
  <div class="subtitle">FingerMath & Soroban</div>

  <!-- ...phần còn lại giữ nguyên — Home, Menu, Config, Game, Chart, Result... -->
</div>

<!-- JS -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/utils.js"></script>
<script src="assets/js/core/rules.js"></script>
<script src="assets/js/core/sound.js"></script>
<script src="assets/js/core/history.js"></script>
<script src="assets/js/core/generator.js"></script>
<script src="assets/js/modes/fingermath.js"></script>
<script src="assets/js/modes/soroban.js"></script>
<script src="assets/js/screens/navigation.js"></script>
<script src="assets/js/screens/configScreen.js"></script>
<script src="assets/js/screens/gameScreen.js"></script>
<script src="assets/js/screens/resultScreen.js"></script>
<script src="assets/js/screens/chartScreen.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
